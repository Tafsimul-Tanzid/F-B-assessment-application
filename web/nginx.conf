server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: the router owns the path, so any unknown path must return
  # index.html rather than a 404. Without this, refreshing on /hq/reports or
  # deep-linking to it breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
