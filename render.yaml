# Render blueprint: managed Postgres + the API (Docker) + the SPA (static).
#
# Deploy with: New > Blueprint, pointing at this repository.
# Everything below is declarative, so the deployment is reviewable in the repo
# rather than being clicked together in a dashboard.

databases:
  - name: fnb-pos-db
    databaseName: fnb_pos
    user: fnb
    plan: free

services:
  # --- API -----------------------------------------------------------------
  - type: web
    name: fnb-pos-api
    runtime: docker
    plan: free
    rootDir: server
    # Repo-root-relative REGARDLESS of rootDir above - Render's own blueprint
    # spec is explicit about this ("relative to the repo root"). `./Dockerfile`
    # here would resolve to the repo root and fail the build.
    dockerfilePath: server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4010
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-pos-db
          property: connectionString
      # Managed Postgres requires TLS.
      - key: DB_SSL
        value: 'true'
      # Free-tier Postgres caps connections, and each in-flight sale pins one
      # for the length of its transaction, so this stays deliberately small.
      - key: DB_POOL_MAX
        value: 8
      - key: JWT_SECRET
        generateValue: true
      # NOT `fromService ... property: host`: that property is documented as
      # "the service's hostname on the PRIVATE network" - it omits the
      # https:// scheme (so a browser's Origin header, which always includes
      # the scheme, would never string-match it) and is not even defined for
      # a static-site service type in the first place. Render always exposes
      # a service at https://<name>.onrender.com unless a custom domain is
      # attached, so the full public URL is hardcoded here instead.
      #
      # VERIFY AFTER FIRST DEPLOY: if `fnb-pos-web` was already taken by
      # another Render account, Render appends a random suffix to the actual
      # subdomain - check the real URL in the dashboard and update this value
      # (and VITE_API_BASE_URL below) if it differs.
      - key: CORS_ORIGIN
        value: https://fnb-pos-web.onrender.com
      # Migrations run on boot so a deploy never serves a stale schema.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: 'true'
      # Seeds the demo dataset on first boot. Turn this off for anything real.
      - key: SEED_ON_BOOT
        value: 'true'
      - key: LOG_LEVEL
        value: info

  # --- Frontend ------------------------------------------------------------
  - type: web
    name: fnb-pos-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Compiled into the bundle at build time, so it must resolve during the
      # build rather than at run time. See the CORS_ORIGIN comment above for
      # why this is a hardcoded full URL rather than `fromService ... host`.
      - key: VITE_API_BASE_URL
        value: https://fnb-pos-api.onrender.com
    routes:
      # Single-page app: the router owns the path, so unknown paths must serve
      # index.html or a refresh on /hq/reports would 404.
      - type: rewrite
        source: /*
        destination: /index.html
